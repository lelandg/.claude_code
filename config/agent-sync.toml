# Scope for tools/agent-config-sync/sync.py — two-way WSL <-> Windows sync of
# agent instruction files. Paths are relative to each home directory.
# Design: Docs/plans/2026-10-17-slim-agent-config-sync-design.md
#
# Out of scope on purpose: skills and plugins (Claude Code syncs them),
# agents, and the public mirror (/publish-claude-config).

schema_version = 2

# Kept identical on both sides; a one-sided change is copied across.
files = [
  ".config/agents/AGENTS.md",
  ".claude/CLAUDE.md",
  ".claude/tools/config-secrets-guard.py",
]

trees = [
  { path = ".claude/instructions", glob = "*.md" },
]

# Per-CLI copies of the canonical house rules. WSL uses symlinks (left alone);
# Windows uses plain copies, which are regenerated from the source.
derived = [
  { path = ".codex/AGENTS.md", from = ".config/agents/AGENTS.md" },
  { path = ".copilot/copilot-instructions.md", from = ".config/agents/AGENTS.md" },
  { path = ".gemini/AGENTS.md", from = ".config/agents/AGENTS.md" },
]

# Report only: these hold per-platform paths, so they are compared by key name
# and never written. Values are never printed.
[[report]]
path = ".claude/settings.json"
fields = ["hooks", "permissions", "env", "model"]

[[report]]
path = ".codex/config.toml"
fields = ["model", "model_reasoning_effort"]

[[report]]
path = ".codex/hooks.json"
